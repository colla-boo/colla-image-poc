embedding:
  model: google/siglip-base-patch16-224
  revision: main
  batch_size: 16
duplicate:
  phash_max_distance: 8
  cosine_similarity_threshold: 0.94
  candidate_time_window_minutes: 180
moment:
  coarse_time_gap_minutes: 45
  time_weight: 0.50
  visual_weight: 0.35
  gps_weight: 0.15
  max_time_distance_minutes: 60
  max_gps_distance_meters: 2000
  split_similarity_threshold: 0.49
quality:
  sharpness_weight: 0.45
  exposure_weight: 0.25
  contrast_weight: 0.15
  resolution_weight: 0.15
ranking:
  quality_weight: 1.0
  similarity_penalty: 0.35
  contributor_balance_weight: 0.15
  top_k: 5
semantics:
  confidence_threshold: 0.18
  labels:
    people: "a photo of one person"
    group photo: "a photo of a group of people"
    landscape: "a landscape photograph"
    food: "a photo of food"
    indoor: "a photo of an indoor room"
    architecture: "a photo of a building"
    transportation: "a photo of a vehicle"
    night: "a photograph taken at night"
    animal: "a photo of an animal"
    document or screenshot: "a screenshot or a photograph of a document"
    other: "an ordinary photograph"
